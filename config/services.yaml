services:
  - id: instagram.profile
    title: Instagram Profile
    platform: Instagram
    description: Retrieve public profile metadata from a canonical Instagram profile URL.
    input_fields:
      - name: url
        description: Canonical Instagram profile URL.
        format: url
    provider: {name: scrapecreators}
    enabled: false
    public: false
    timeout_seconds: 25
    retries: 1
    estimated_upstream_cost_cents: 0
    price_cents: 5
