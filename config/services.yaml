    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Returns source video and preview URLs without downloading the asset.

  - id: linkedin.profile
    title: LinkedIn Profile Enrichment
    platform: LinkedIn
    description: Create a durable job for normalized public LinkedIn profile enrichment.
    execution: async
    response_shape: profile
    input_fields:
      - {name: url, description: Canonical LinkedIn person profile URL., format: url}
    provider: {name: apify, actor_id: "automation-lab~linkedin-profile-scraper", max_total_charge_microusd: 50000}
    enabled: true
    public: true
    catalog_status: available
    timeout_seconds: 120
    retries: 0
    estimated_upstream_cost_microusd: 50000
    provider_unit_cost_microusd: 18000
    cost_verified: true
    price_cents: 10
    docs: Returns normalized profile, experience, education, and skills when publicly available.

