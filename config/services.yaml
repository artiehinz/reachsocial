services:
  - id: news.person
    title: Person News
    platform: News
    description: Retrieve recent, normalized worldwide news coverage for one public person.
    response_shape: news
    input_fields:
      - {name: full_name, description: Public full name used for an exact-phrase news query., format: string, max_length: 200}
      - {name: max_items, description: Maximum recent articles to return., required: false, format: integer, default: 50, minimum: 1, maximum: 100}
    provider: {name: gdelt, route: https://api.gdeltproject.org/api/v2/doc/doc, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 20
    retries: 0
    cache_ttl_seconds: 21600
    estimated_upstream_cost_microusd: 0
    provider_unit_cost_microusd: 0
    cost_verified: true
    price_cents: 0
    docs: Internal B2B service for sanitized GDELT DOC results; no raw payload or credential is returned.

  - id: instagram.profile
    title: Instagram Profile
    platform: Instagram
    description: Retrieve normalized public Instagram profile metadata.
    response_shape: profile
    input_fields:
      - {name: url, description: Canonical Instagram profile URL., format: url}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v1/instagram/profile, method: GET}
    enabled: true
    public: true
    catalog_status: available
    timeout_seconds: 25
    retries: 1
    cache_ttl_seconds: 21600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Returns a provider-neutral profile object and never downloads profile media.

  - id: instagram.post
    title: Instagram Post
    platform: Instagram
    description: Retrieve normalized public post or reel metadata and source media URLs.
    response_shape: item
    input_fields:
      - {name: url, description: Canonical Instagram post or reel URL., format: url}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v1/instagram/post, method: GET}
    enabled: true
    public: true
    catalog_status: available
    timeout_seconds: 25
    retries: 1
    cache_ttl_seconds: 3600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Returns source URLs only; ReachSocial does not download or retain media bytes.

  - id: instagram.feed
    title: Instagram Profile Posts
    platform: Instagram
    description: Retrieve the latest normalized public posts for an Instagram profile.
    response_shape: feed
    input_fields:
      - {name: url, description: Canonical Instagram profile URL., format: url}
      - {name: max_items, description: Maximum posts to return., required: false, format: integer, default: 12, minimum: 1, maximum: 30}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v2/instagram/user/posts, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 30
    retries: 1
    cache_ttl_seconds: 600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Private InstaGet integration returning a bounded normalized profile feed and temporary media references.

  - id: instagram.stories
    title: Instagram Stories
    platform: Instagram
    description: Create a durable job for current public Instagram stories.
    execution: async
    response_shape: stories
    input_fields:
      - {name: url, description: Canonical Instagram profile URL., format: url}
      - {name: max_items, description: Maximum stories to return., required: false, format: integer, default: 20, minimum: 1, maximum: 50}
    provider: {name: apify}
    enabled: false
    public: false
    catalog_status: paused
    timeout_seconds: 120
    retries: 0
    estimated_upstream_cost_microusd: 0
    provider_unit_cost_microusd: 0
    cost_verified: false
    price_cents: 15
    docs: Submit through the jobs endpoint and poll with the returned job token.

  - id: x.profile
    title: X Profile
    platform: X
    description: Retrieve normalized public X profile metadata.
    response_shape: profile
    input_fields:
      - {name: url, description: Canonical X profile URL., format: url}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v1/twitter/profile, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 25
    retries: 1
    cache_ttl_seconds: 21600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Normalized profile metadata from the public X profile.

  - id: x.post
    title: X Post
    platform: X
    description: Retrieve a normalized public X post and source media URLs.
    response_shape: item
    input_fields:
      - {name: url, description: Canonical X status URL., format: url}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v1/twitter/tweet, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 25
    retries: 1
    cache_ttl_seconds: 3600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Returns normalized text, author, engagement, and source media URLs.

  - id: x.feed
    title: X Public Posts
    platform: X
    description: Retrieve a provider-selected set of normalized public posts from an X profile.
    response_shape: feed
    input_fields:
      - {name: url, description: Canonical X profile URL., format: url}
      - {name: max_items, description: Maximum posts to return., required: false, format: integer, default: 12, minimum: 1, maximum: 30}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v1/twitter/user-tweets, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 30
    retries: 1
    cache_ttl_seconds: 600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Private InstaGet integration returning a bounded normalized X feed and temporary media references. Provider ordering is not guaranteed to be chronological.

  - id: tiktok.profile
    title: TikTok Profile
    platform: TikTok
    description: Retrieve normalized public TikTok profile metadata.
    response_shape: profile
    input_fields:
      - {name: url, description: Canonical TikTok profile URL., format: url}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v1/tiktok/profile, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 25
    retries: 1
    cache_ttl_seconds: 21600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Returns profile metadata without retaining avatars or videos.

  - id: tiktok.feed
    title: TikTok Profile Videos
    platform: TikTok
    description: Retrieve a normalized, cursor-paginated public TikTok profile feed.
    response_shape: feed
    input_fields:
      - {name: url, description: Canonical TikTok profile URL., format: url}
      - {name: max_items, description: Maximum videos to return., required: false, format: integer, default: 12, minimum: 1, maximum: 30}
      - {name: cursor, description: Opaque provider-neutral pagination cursor., required: false, format: string}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v3/tiktok/profile/videos, method: GET}
    enabled: true
    public: false
    catalog_status: private
    timeout_seconds: 30
    retries: 1
    cache_ttl_seconds: 600
    estimated_upstream_cost_microusd: 1880
    provider_unit_cost_microusd: 1880
    cost_verified: false
    price_cents: 5
    docs: Pass next_cursor back as cursor to request another page.

  - id: tiktok.video
    title: TikTok Video
    platform: TikTok
    description: Retrieve normalized public TikTok video metadata and source URLs.
    response_shape: item
    input_fields:
      - {name: url, description: Canonical TikTok video URL., format: url}
    provider: {name: scrapecreators, route: https://api.scrapecreators.com/v2/tiktok/video, method: GET}
    enabled: true
