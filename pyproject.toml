[project]
name = "reachsocial"
version = "0.1.0"
description = "Provider-neutral social data API, MCP server, and website"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "PyYAML>=6.0,<7",
  "mcp>=1.8,<3",
  "x402[evm,fastapi]>=2.18.0",
  "cdp-sdk>=1.47.1",
  "PyJWT>=2.14.0,<3",
  "httpcore2>=2.10.0,<3",
  "httpx2>=2.12.0,<3",
  "urllib3>=2.8.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachsocial"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live_contract: credential-gated tests that can spend provider credits"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
