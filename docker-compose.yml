services:
  app:
    image: ${REACHSOCIAL_IMAGE:-reachsocial:local}
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/reachsocial.db
      CATALOG_PATH: /app/config/services.yaml
    expose:
      - "8000"
    volumes:
      - reachsocial_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      app:
        condition: service_healthy
    environment:
      REACHSOCIAL_ADDRESS: ${REACHSOCIAL_ADDRESS:-localhost}
      LIBERATED_ADDRESS: ${LIBERATED_ADDRESS:-liberated.site}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/cloudflare-origin-pull-ca.pem:/etc/caddy/cloudflare-origin-pull-ca.pem:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - default
      - edge

volumes:
  reachsocial_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    name: reachsocial_edge
