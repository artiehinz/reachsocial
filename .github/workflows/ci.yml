name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.29"}
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: docker build -t reachsocial:${{ github.sha }} .
